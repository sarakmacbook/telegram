<!doctype html>
<html lang="en">
<head>
<title>OKX P2P merchants</title>
<style>
:root{color-scheme:light dark;--bg:var(--tg-theme-bg-color,#fff);--text:var(--tg-theme-text-color,#182127);--hint:var(--tg-theme-hint-color,#87939b);--surface:var(--tg-theme-secondary-bg-color,#f3f5f6);--accent:var(--tg-theme-button-color,#2489d5);--accentText:var(--tg-theme-button-text-color,#fff)}*{box-sizing:border-box}body{margin:0;padding:0;background:var(--bg);color:var(--text);font:13px system-ui,sans-serif}.widget{padding:12px 13px 14px}.top{display:flex;align-items:center;gap:8px}.logo{width:28px;height:28px;border-radius:9px;background:#111;display:grid;place-items:center;flex:none}.logo svg{width:16px;height:16px}.eyebrow{font-size:9px;letter-spacing:.1em;font-weight:700;color:var(--hint);text-transform:uppercase}.brand{font-size:13px;font-weight:700;margin-top:1px}.badge{margin-left:auto;background:var(--surface);color:var(--hint);font-size:9px;font-weight:700;letter-spacing:.04em;padding:5px 7px;border-radius:20px}h1{font-size:17px;letter-spacing:-.02em;line-height:1.15;margin:11px 0 3px}.sub{color:var(--hint);font-size:11px;line-height:1.35;margin:0}.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:11px 0 7px}.bar-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em}.bar-note{font-size:10px;color:var(--hint);text-align:right}.card{background:var(--surface);border-radius:12px;padding:10px;margin:0 0 7px}.merchant{display:flex;align-items:center;gap:8px}.avatar{width:26px;height:26px;display:grid;place-items:center;border-radius:50%;background:var(--bg);font-size:11px;font-weight:700;color:var(--text);flex:none}.identity{min-width:0;flex:1}.name{font-weight:700;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta{font-size:10px;color:var(--hint);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.check{color:#35ad79;font-size:11px;margin-left:2px}.quote{display:flex;justify-content:space-between;gap:10px;align-items:flex-end;margin-top:9px}.label{font-size:9px;font-weight:700;color:var(--hint);text-transform:uppercase;letter-spacing:.06em}.price{font-size:18px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-top:1px}.price small{font-size:10px;font-weight:600;letter-spacing:0}.limits{font-size:10px;color:var(--hint);line-height:1.4;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.buy{border:0;border-radius:9px;background:var(--accent);color:var(--accentText);font:700 11px system-ui,sans-serif;padding:8px 13px;cursor:pointer;flex:none}.buy:disabled,button:disabled{opacity:.5;cursor:default}.more{font-size:10px;color:var(--hint);text-align:center;padding:1px 0 0}.footer{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:9px}.footnote{color:var(--hint);font-size:10px;line-height:1.35}.refresh{border:0;background:transparent;color:var(--accent);font:700 11px system-ui,sans-serif;padding:6px 0 6px 8px;white-space:nowrap;cursor:pointer}.empty{border:1px dashed var(--hint);border-radius:12px;padding:16px 14px;text-align:center}.empty-icon{font-size:18px}.empty strong{display:block;font-size:12px;margin:6px 0 3px}.empty p{color:var(--hint);font-size:11px;line-height:1.4;margin:0}.status{min-height:14px;color:var(--hint);font-size:10px;line-height:1.35;margin-top:7px}.status.error{color:var(--tg-theme-destructive-text-color,#d84b4b)}
</style>
</head>
<body>
<main class="widget">
  <header class="top"><div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="white"><path d="M1 1h6v6H1zm8 0h6v6H9zm8 0h6v6h-6zM9 9h6v6H9zM1 17h6v6H1zm8 0h6v6H9zm8 0h6v6h-6z"/></svg></div><div><div class="eyebrow">P2P marketplace</div><div class="brand">OKX merchants</div></div><span class="badge">P2P · USDT</span></header>
  <h1>Find your merchant.</h1><p class="sub">Offers from the bot, refreshed on tap.</p>
  <div class="bar"><span class="bar-title">Available offers</span><span class="bar-note" id="updated">Waiting for offers</span></div>
  <section id="offers" aria-label="Merchant offers"></section>
  <div class="more" id="more"></div>
  <div class="footer"><div class="footnote">Prices and availability are supplied by the bot.<br>Always review trade details before proceeding.</div><button class="refresh" id="refresh" type="button">↻ &nbsp;Refresh</button></div>
  <div id="status" class="status" role="status" aria-live="polite"></div>
</main>
<script>
(function(){
  var W=window.TelegramWidget,MAX=3,BUDGET=590,offers=document.getElementById('offers'),updated=document.getElementById('updated'),status=document.getElementById('status'),refresh=document.getElementById('refresh'),more=document.getElementById('more'),busy=false;
  function text(tag,cls,value){var el=document.createElement(tag);el.className=cls;el.textContent=value;return el}
  function parse(raw){try{var v=JSON.parse(raw);return v&&typeof v==='object'?v:null}catch(e){return null}}
  function field(v,fallback){return v===undefined||v===null||v===''?fallback:String(v)}
  function ask(data){if(!W||!W.request){status.className='status error';status.textContent='Open this widget in Telegram to contact the bot.';return}if(busy)return;busy=true;refresh.disabled=true;status.className='status';status.textContent='Contacting the bot…';W.request(data).then(function(a){status.textContent=a&&a.result?String(a.result):'Request sent. Waiting for the bot to update offers.'},function(e){status.className='status error';status.textContent='Could not contact the bot'+(e&&e.code?' ('+e.code+')':'')+'. Please try again.'}).then(function(){busy=false;refresh.disabled=false})}
  function height(){try{return document.body.getBoundingClientRect().height}catch(e){return 0}}
  function fit(){var cards=offers.querySelectorAll('.card'),hidden=0;for(var i=cards.length-1;i>0;i--){if(height()<=BUDGET)break;cards[i].style.display='none';hidden++}return hidden}
  function render(){
    var data=W&&(parse(W.chatData)||parse(W.publicData)),list=data&&Array.isArray(data.offers)?data.offers:[],shown=list.slice(0,MAX);
    offers.textContent='';updated.textContent=data&&data.updated?String(data.updated):'Waiting for offers';
    if(!list.length){var empty=text('div','empty','');empty.appendChild(text('div','empty-icon','◌'));empty.appendChild(text('strong','','No offers to show yet'));empty.appendChild(text('p','','Tap Refresh to ask the bot for the latest OKX P2P merchants.'));offers.appendChild(empty);more.textContent='';return}
    shown.forEach(function(o){if(!o||typeof o!=='object')return;var card=text('article','card',''),head=text('div','merchant',''),name=field(o.name,'Merchant'),avatar=text('div','avatar',name.slice(0,1).toUpperCase()),identity=text('div','identity',''),nameEl=text('div','name',name);if(o.verified===true)nameEl.appendChild(text('span','check',' ✓'));identity.appendChild(nameEl);identity.appendChild(text('div','meta',field(o.orders,'—')+' orders · '+field(o.completion,'—')+' completion'));head.appendChild(avatar);head.appendChild(identity);card.appendChild(head);var quote=text('div','quote',''),amount=text('div','','');amount.appendChild(text('div','label','Price per USDT'));var price=text('div','price',field(o.price,'—')+' ');price.appendChild(text('small','',field(o.currency,'')));amount.appendChild(price);quote.appendChild(amount);var button=text('button','buy','View offer');button.type='button';var id=field(o.id,'');button.disabled=!/^[A-Za-z0-9_-]{1,48}$/.test(id);button.addEventListener('click',function(){ask('offer:'+id)});quote.appendChild(button);card.appendChild(quote);card.appendChild(text('div','limits','Limit  '+field(o.limit,'—')+' · '+field(o.payment,'Payment method unavailable')));offers.appendChild(card)});
    var rest=list.length-shown.length+fit();more.textContent=rest>0?rest+' more merchant'+(rest===1?'':'s')+' not shown in this card':'';
  }
  refresh.addEventListener('click',function(){ask('refresh')});if(W){W.onEvent('chatDataChanged',render);W.onEvent('publicDataChanged',render);if(W.watchPublicData)W.watchPublicData()}render();
})();
</script>
</body>
</html>
