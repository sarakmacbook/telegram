<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OKX P2P merchants</title>
<style>
:root{color-scheme:light dark;--bg:var(--tg-theme-bg-color,#fff);--text:var(--tg-theme-text-color,#182127);--hint:var(--tg-theme-hint-color,#87939b);--surface:var(--tg-theme-secondary-bg-color,#f3f5f6);--accent:var(--tg-theme-button-color,#2489d5);--accentText:var(--tg-theme-button-text-color,#fff)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.widget{max-width:520px;margin:auto;padding:20px 18px 26px}.top{display:flex;align-items:center;gap:10px}.logo{width:38px;height:38px;border-radius:12px;background:#111;display:grid;place-items:center;flex:none}.logo svg{width:22px;height:22px}.eyebrow{font-size:10px;letter-spacing:.12em;font-weight:800;color:var(--hint);text-transform:uppercase}.brand{font-size:15px;font-weight:750;margin-top:2px}.badge{margin-left:auto;background:var(--surface);color:var(--hint);font-size:10px;font-weight:700;letter-spacing:.06em;padding:7px 9px;border-radius:20px}h1{font-size:27px;letter-spacing:-.045em;line-height:1.1;margin:26px 0 7px}.sub{color:var(--hint);line-height:1.45;margin:0}.bar{display:flex;align-items:center;justify-content:space-between;margin:24px 0 12px}.bar-title{font-size:12px;font-weight:750;text-transform:uppercase;letter-spacing:.09em}.bar-note{font-size:11px;color:var(--hint)}.card{background:var(--surface);border-radius:16px;padding:15px;margin:0 0 10px}.merchant{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;background:var(--bg);font-size:14px;font-weight:800;color:var(--text);flex:none}.identity{min-width:0;flex:1}.name{font-weight:750;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta{font-size:11px;color:var(--hint);margin-top:4px}.check{color:#35ad79;font-size:12px;margin-left:3px}.quote{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-top:17px}.label{font-size:10px;font-weight:700;color:var(--hint);text-transform:uppercase;letter-spacing:.08em}.price{font-size:22px;font-weight:800;letter-spacing:-.035em;margin-top:3px}.price small{font-size:12px;letter-spacing:0}.limits{font-size:11px;color:var(--hint);line-height:1.6;margin-top:9px}.buy{border:0;border-radius:10px;background:var(--accent);color:var(--accentText);font:700 12px inherit;font-size:12px;font-weight:750;padding:10px 16px;cursor:pointer}.buy:disabled,button:disabled{opacity:.55;cursor:default}.footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px}.footnote{color:var(--hint);font-size:11px;line-height:1.4}.refresh{border:0;background:transparent;color:var(--accent);font:inherit;font-size:12px;font-weight:750;padding:8px 0 8px 10px;white-space:nowrap;cursor:pointer}.empty{border:1px dashed var(--hint);border-radius:16px;padding:24px 18px;text-align:center}.empty-icon{font-size:24px}.empty strong{display:block;margin:8px 0 4px}.empty p{color:var(--hint);font-size:12px;line-height:1.5;margin:0}.status{min-height:16px;color:var(--hint);font-size:11px;line-height:1.4;margin-top:10px}.status.error{color:var(--tg-theme-destructive-text-color,#d84b4b)}
</style>
</head>
<body>
<main class="widget">
  <header class="top"><div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="white"><path d="M1 1h6v6H1zm8 0h6v6H9zm8 0h6v6h-6zM9 9h6v6H9zM1 17h6v6H1zm8 0h6v6H9zm8 0h6v6h-6z"/></svg></div><div><div class="eyebrow">P2P marketplace</div><div class="brand">OKX merchants</div></div><span class="badge">P2P · USDT</span></header>
  <h1>Find your merchant.</h1><p class="sub">Browse offers shared by the bot and trade with confidence.</p>
  <div class="bar"><span class="bar-title">Available offers</span><span class="bar-note" id="updated">Waiting for offers</span></div>
  <section id="offers" aria-label="Merchant offers"></section>
  <div class="footer"><div class="footnote">Prices and availability are supplied by the bot.<br>Always review trade details before proceeding.</div><button class="refresh" id="refresh" type="button">↻ &nbsp;Refresh</button></div>
  <div id="status" class="status" role="status" aria-live="polite"></div>
</main>
<script>
(function(){
  var W=window.TelegramWidget, offers=document.getElementById('offers'), updated=document.getElementById('updated'), status=document.getElementById('status'), refresh=document.getElementById('refresh'), busy=false;
  function text(tag,cls,value){var el=document.createElement(tag);el.className=cls;el.textContent=value;return el}
  function parse(raw){try{var v=JSON.parse(raw);return v&&typeof v==='object'?v:null}catch(e){return null}}
  function field(v,fallback){return v===undefined||v===null||v===''?fallback:String(v)}
  function ask(data){if(!W||!W.request){status.className='status error';status.textContent='Open this widget in Telegram to contact the bot.';return}if(busy)return;busy=true;refresh.disabled=true;status.className='status';status.textContent='Contacting the bot…';W.request(data).then(function(a){status.textContent=a&&a.result?String(a.result):'Request sent. Waiting for the bot to update offers.'},function(e){status.className='status error';status.textContent='Could not contact the bot'+(e&&e.code?' ('+e.code+')':'')+'. Please try again.'}).then(function(){busy=false;refresh.disabled=false})}
  function render(){var data=W&&(parse(W.chatData)||parse(W.publicData)), list=data&&Array.isArray(data.offers)?data.offers:[];offers.textContent='';updated.textContent=data&&data.updated?String(data.updated):'Waiting for offers';if(!list.length){var empty=text('div','empty','');empty.appendChild(text('div','empty-icon','◌'));empty.appendChild(text('strong','','No offers to show yet'));empty.appendChild(text('p','','Tap Refresh to ask the bot for the latest OKX P2P merchants.'));offers.appendChild(empty);return}list.slice(0,10).forEach(function(o){if(!o||typeof o!=='object')return;var card=text('article','card',''),head=text('div','merchant',''),name=field(o.name,'Merchant'),avatar=text('div','avatar',name.slice(0,1).toUpperCase()),identity=text('div','identity',''),nameEl=text('div','name',name);if(o.verified===true)nameEl.appendChild(text('span','check',' ✓'));identity.appendChild(nameEl);identity.appendChild(text('div','meta',field(o.orders,'—')+' orders · '+field(o.completion,'—')+' completion'));head.appendChild(avatar);head.appendChild(identity);card.appendChild(head);var quote=text('div','quote',''),amount=text('div','','');amount.appendChild(text('div','label','Price per USDT'));var price=text('div','price',field(o.price,'—')+' ');price.appendChild(text('small','',field(o.currency,'')));amount.appendChild(price);quote.appendChild(amount);var button=text('button','buy','View offer');button.type='button';var id=field(o.id,'');button.disabled=!/^[A-Za-z0-9_-]{1,48}$/.test(id);button.addEventListener('click',function(){ask('offer:'+id)});quote.appendChild(button);card.appendChild(quote);card.appendChild(text('div','limits','Limit  '+field(o.limit,'—')+' · '+field(o.payment,'Payment method unavailable')));offers.appendChild(card)})}
  refresh.addEventListener('click',function(){ask('refresh')});if(W){W.onEvent('chatDataChanged',render);W.onEvent('publicDataChanged',render);if(W.watchPublicData)W.watchPublicData();if(W.ready)W.ready()}render();
})();
</script>
</body>
</html>
